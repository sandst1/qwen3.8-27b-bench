# dedupe_by decides what counts as "the same item" across runs:
# "link" (the default) or "raw_id". See "How duplicates are prevented"
# in README.md before changing these.

[[feeds]]
name = "newsroom"
format = "newsroom"
url = "file://fixtures/snapshot-a/newsroom.json"
# entry_id is stable; the URL's utm_campaign rotates weekly.
dedupe_by = "raw_id"

[[feeds]]
name = "blogroll"
format = "blogroll"
url = "file://fixtures/snapshot-a/blogroll.json"
dedupe_by = "link"

[[feeds]]
name = "wire"
format = "generic"
url = "file://fixtures/snapshot-a/wire.json"
# The guid is regenerated whenever an item is edited; the link is stable.
dedupe_by = "link"

[[channels]]
name = "ops"
type = "stdout"
title = "Ops digest"
keywords = ["port", "levy", "fee"]

[[channels]]
name = "energy"
type = "stdout"
title = "Energy digest"
keywords = ["tender", "grid", "offshore"]

[[channels]]
name = "everything"
type = "stdout"
title = "Firehose"
keywords = []
